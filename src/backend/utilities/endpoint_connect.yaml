openapi: 3.1.0
info:
  title: CMS Training Project API
  version: 1.0.0
  description: |
    A simple API for storing, seraching anf retriving articles
servers:
  - url:  https:/localhost:3000
    description: Local development environment

components:
  schemas:
    Author:
      type: object
      properties:
       first_name:
        type: string
       last_name:
        type: string
       email:
        type: string
        format: email
       id:
        type: integer
        readOnly: true # readOnly - indicates that the property is read-only and cannot be modified by the client when creating or updating an author. It is typically used for properties that are generated by the server (like id) and should not be provided by the client in the request body.
        required: [first_name, last_name, email]

    Article:
        type: object
        properties:
         id:
          type: integer
          readOnly: true
         headline:
          type: string
         text:
          type: string
         author:
           $ref: '#/components/schemas/Author'
        required: [headline, text, author]

paths:
  /authors:
    get:
      summary: Get all authors
      operationId: getAuthors # operationId - a unique identifier for the operation, which can be used for code generation and client libraries.
      tags: #group and organize API endpoints for documentation and Swagger UI
      - Authors 
      responses:
        '200':
          description: A list of authors
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'

    post:
        summary: Create a new author
        operationId: createAuthor
        tags: 
        - Authors
        requestBody:
          required: true
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'
        responses:
          '201':
            description: Author created successfully
          '400':
            description: Invalid input  

  /authors/{id}:
    get:
      summary: Get details of a specific author by ID
      operationId: getAuthorById
      tags: 
      - Authors
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Author details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '404':
          description: Author not found

    put:
      summary: Update an existing author by ID
      operationId: updateAuthorById
      tags: 
      - Authors
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Author'
      responses:
        '200':
          description: Author updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          description: Invalid input
        '404':
          description: Author not found

  /authors/search:
    get:
      summary: Search for authors by text
      operationId: searchAuthors
      tags: 
      - Authors
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            
      responses:
        '200':
          description: A list of authors matching the search criteria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'

        '400':
          description: Invalid search query

  /articles:
    get:
      summary: Get a list of all articles
      operationId: getArticles 
      tags: 
      - Articles
      responses:
        '200':
          description: A list of articles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'

    post:
        summary: Create a new article
        operationId: createArticle
        tags: 
        - Articles
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        responses:
          '201':
            description: Article created successfully
            content:
              application/json:
                schema:
                  $ref: '#/components/schemas/Article'
          '400':
            description: Invalid input  

  /articles/{id}:
    get:
      summary: Get details of a specific article by ID
      operationId: getArticleById
      tags: 
      - Articles
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Article details retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '404':
          description: Article not found

    put:
      summary: Update an existing article by ID
      operationId: updateArticleById
      tags: 
      - Articles
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Article'
      responses:
        '200':
          description: Article updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Article'
        '400':
          description: Invalid input
        '404':
          description: Article not found

  /articles/search:
    get:
      summary: Search for articles by text
      operationId: searchArticles
      tags: 
      - Articles
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            
      responses:
        '200':
          description: A list of articles matching the search criteria
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Article'

        '400':
          description: Invalid search query  
          






      

    

